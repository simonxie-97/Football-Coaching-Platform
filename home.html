<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>橄榄球教学系统 - 首页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="main-header">
      <h1>🏈 青少年橄榄球教学与训练平台</h1>
      <p>选择教学模块进入专属教案系统</p>
    </header>

    <div class="grid-container">
      <!-- 1. 校队计划入口 -->
      <a href="U6U7/index.html" class="portal-card">
        <div class="icon">📅</div>
        <h2>U6-U7 校队计划</h2>
        <p>包含季度、月度大纲及每课 90 分钟标准化教案</p>
      </a>

      <!-- 2. 进攻基本功入口 -->
      <a href="offense/index.html" class="portal-card offense-card">
        <div class="icon">🏃</div>
        <h2>进攻基本功库</h2>
        <p>持球保护（包贴夹）、接球（鳄鱼嘴）、蹬地变向闪避等专项训练</p>
      </a>

      <!-- 3. 防守基本功入口 -->
      <a href="defense/index.html" class="portal-card defense-card">
        <div class="icon">🛡️</div>
        <h2>防守基本功库</h2>
        <p>降重心拔旗（抓捏提）、追踪角度、滑步与 Breakdown 减速控速</p>
      </a>
    </div>
  </div>
</body>
</html>
