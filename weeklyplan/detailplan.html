    .container { max-width: 100% !important; padding: 0 !important; box-shadow: none !important; background: transparent !important; }
    
    /* Tab 切换栏样式 */
    .tab-container {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      margin-bottom: 15px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0;
    }
    .tab-button {
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 700;
      color: #64748b;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-button:hover {
      background-color: #e2e8f0;
      color: #1e293b;
    }
    .tab-button.active {
      background-color: #ea580c; /* 活力橙主色 */
      color: #ffffff;
      border-color: #ea580c;
    }

    /* Tab 内容区域 */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* 模块计划表格样式 */
    table.plan-table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      table-layout: fixed;
    }
    table.plan-table th, table.plan-table td {

      padding: 14px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;

    table.plan-table td.row-header {

      font-weight: bold;
      color: #334155;
      text-align: center;
      vertical-align: middle;
      width: 120px;

      padding: 10px;

<script>
  const drillFrameObservers = new WeakMap();

  function fitDrillFrameToContent(iframe) {
    iframe.addEventListener('load', () => {
      const doc = iframe.contentDocument;
      if (!doc || !doc.documentElement) return;

      const updateHeight = () => {
        const root = doc.documentElement;
        const body = doc.body;
        
        // 计算子页面内容的实际最大高度
        const flowHeight = body ? Array.from(body.children).reduce((bottom, element) => {
          if (doc.defaultView.getComputedStyle(element).position === 'fixed') return bottom;
          return Math.max(bottom, element.getBoundingClientRect().bottom + doc.defaultView.scrollY);
        }, 0) : 0;
        
        const overflowHeight = Math.max(
          root.scrollHeight > root.clientHeight ? root.scrollHeight : 0,
          body && body.scrollHeight > body.clientHeight ? body.scrollHeight : 0
        );
        
        // 增加 30px 的安全余量，防止底部文字/边框被遮挡
        const contentHeight = Math.ceil(Math.max(flowHeight, overflowHeight) + 30);
        const targetHeight = Math.max(350, contentHeight);

        if (Math.abs((parseFloat(iframe.style.height) || 350) - targetHeight) > 1) {
          iframe.style.height = `${targetHeight}px`;
        }
      };

      const scheduleUpdate = () => {
        requestAnimationFrame(() => requestAnimationFrame(updateHeight));
      };

      const previousObserver = drillFrameObservers.get(iframe);
      if (previousObserver) previousObserver.disconnect();

      scheduleUpdate();
      if ('ResizeObserver' in window) {
        const observer = new ResizeObserver(scheduleUpdate);
        observer.observe(iframe);
        observer.observe(doc.documentElement);
        if (doc.body) observer.observe(doc.body);
        drillFrameObservers.set(iframe, observer);
      }
      if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(scheduleUpdate);
      window.setTimeout(scheduleUpdate, 300);
      window.setTimeout(scheduleUpdate, 1000);
    });
  }

  document.querySelectorAll('.drill-slot iframe').forEach(fitDrillFrameToContent);
</script>

<!-- Tab 切换逻辑脚本 -->
<script>
  function switchTab(tabId, btnElement) {
    // 隐藏所有 tab 内容
    const contents = document.querySelectorAll('.tab-content');
    contents.forEach(content => content.classList.remove('active'));

    // 取消所有按钮的 active 状态
    const buttons = document.querySelectorAll('.tab-button');
    buttons.forEach(btn => btn.classList.remove('active'));

    // 显示当前点击的 tab 并高亮按钮
    document.getElementById(tabId).classList.add('active');
    btnElement.classList.add('active');
  }
</script>
