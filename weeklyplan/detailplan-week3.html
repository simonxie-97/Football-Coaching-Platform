  <style>
    body { background-color: transparent; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .container { max-width: 100% !important; padding: 0 !important; box-shadow: none !important; background: transparent !important; }
    
    /* Tab 切换栏样式 */
    .tab-container {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      margin-bottom: 15px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0;
    }
    .tab-button {
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 700;
      color: #64748b;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-button:hover {
      background-color: #e2e8f0;
      color: #1e293b;
    }
    .tab-button.active {
      background-color: #ea580c; /* 活力橙主色 */
      color: #ffffff;
      border-color: #ea580c;
    }

    /* Tab 内容区域 */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* 模块计划表格样式 */
    table.plan-table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      table-layout: fixed;
    }
    table.plan-table th, table.plan-table td {
      border: 1px solid #e2e8f0;
      padding: 14px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }
    table.plan-table th {
      background-color: #f8fafc;
      color: #1e293b;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-align: center;
    }
    table.plan-table td.row-header {
      background-color: #f1f5f9;
      font-weight: bold;
      color: #334155;
      text-align: center;
      vertical-align: middle;
      width: 140px;
    }

    /* Drill 槽位容器 */
    .drill-slot {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .drill-slot:last-child {
      margin-bottom: 0;
    }
    .drill-slot iframe {
      display: block;
      height: 550px;
    }
  </style>
</head>

<!-- Tab 切换逻辑脚本 -->
<script>
  function switchTab(tabId, btnElement) {
    const contents = document.querySelectorAll('.tab-content');
    contents.forEach(content => content.classList.remove('active'));

    const buttons = document.querySelectorAll('.tab-button');
    buttons.forEach(btn => btn.classList.remove('active'));

    document.getElementById(tabId).classList.add('active');
    btnElement.classList.add('active');
  }
</script>
