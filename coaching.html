<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教练员培训 - 完整可视化思维导图与PPT教案系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .mindmap-node {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mindmap-node:hover {
      transform: translateY(-3px) scale(1.015);
      box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
    }
    
    /* 背景网格底纹 */
    .bg-grid-pattern {
      background-image: radial-gradient(rgba(148, 163, 184, 0.25) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }

    /* 动态连接线悬停高亮 */
    .connector-path {
      transition: stroke-width 0.3s ease, stroke 0.3s ease, opacity 0.3s ease;
    }

    /* 自定义滚动条样式 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* PPT 幻灯片过渡与模拟比例 */
    .slide-aspect {
      aspect-ratio: 16 / 9;
    }
  </style>
  <link rel="stylesheet" href="css/noprint.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col bg-grid-pattern selection:bg-indigo-500 selection:text-white">

      <div class="relative min-h-[650px] py-4">

        <svg id="svg-connectors" class="absolute inset-0 w-full h-full pointer-events-none z-0 hidden md:block">
          <!-- JS 动态插值计算并渲染贝塞尔曲线 -->
        </svg>

        <!-- 主布局容器：左侧 3 模块 | 中间核心 | 右侧 3 模块 -->

          <!-- 左侧三大核心模块 (1, 2, 3) -->
          <div class="md:col-span-2 flex flex-col space-y-6">
            <div id="wrapper-node-1"></div>
            <div id="wrapper-node-2"></div>
            <div id="wrapper-node-3"></div>
          </div>

          <!-- 中间中心节点 (教练员培训) -->
          <div class="md:col-span-3 flex justify-center py-6 md:py-0">
            <div id="center-node" class="bg-gradient-to-b from-slate-900 to-slate-800 text-white px-8 py-7 rounded-3xl shadow-2xl border-4 border-slate-700 text-center transform transition duration-500 hover:scale-105 relative group">

                <i class="fa-solid fa-graduation-cap"></i>
              </div>
              <h2 class="text-2xl sm:text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-indigo-200">
                教练员培训
              </h2>
              <p class="text-xs text-indigo-300 mt-2 font-medium tracking-wide">
                少儿腰旗橄榄球全体系执教指南
              </p>
              <div class="mt-4 flex justify-center space-x-2 text-[11px] text-slate-400">
                <span class="bg-slate-800/80 px-2.5 py-1 rounded-md border border-slate-700">理论 + 实战</span>
                <span class="bg-slate-800/80 px-2.5 py-1 rounded-md border border-slate-700">全龄段覆盖</span>
              </div>
            </div>
          </div>

          <!-- 右侧三大核心模块 (4, 5, 6) -->
          <div class="md:col-span-2 flex flex-col space-y-6">
            <div id="wrapper-node-4"></div>
            <div id="wrapper-node-5"></div>
            <div id="wrapper-node-6"></div>
          </div>

        </div>

      </div>

    </div>

    <div id="view-ppt" class="hidden w-full transition-opacity duration-300">

            <span>返回思维导图</span>
          </button>
          <div class="text-xs sm:text-sm text-slate-400 flex items-center space-x-2">
            <span>思维导图</span>
            <span>/</span>
            <span id="ppt-breadcrumb-module" class="text-slate-700 font-semibold">模块</span>
            <span>/</span>
            <span id="ppt-breadcrumb-topic" class="text-indigo-600 font-semibold">具体主题</span>
          </div>
        </div>

        <div class="flex items-center space-x-2">
          <!-- <button onclick="togglePPTDarkMode()" id="btn-ppt-darkmode" class="px-3 py-1.5 bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
            <i class="fa-solid fa-moon text-indigo-500"></i>
            <span>暗黑视角</span>
          </button> -->
          <button onclick="toggleFullScreenPPT()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-sm transition flex items-center space-x-1">
            <i class="fa-solid fa-expand"></i>
            <span class="hidden sm:inline">全屏演示</span>
          </button>
        </div>
      </div>

      <!-- 双栏响应式 PPT 工作区 -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- 左侧：知识点章节快速导航树 (占据 4 列) -->
        <div class="lg:col-span-4 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm max-h-[700px] flex flex-col">
          <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
            <h3 class="font-bold text-slate-800 text-sm flex items-center space-x-2">

            </h3>

            </span>
          </div>

          <div id="ppt-tree-sidebar" class="overflow-y-auto space-y-2 flex-1 pr-1">
            <!-- JS 动态渲染侧边栏树 -->
          </div>
        </div>

              </div>
              <div class="text-xs text-slate-400 flex items-center space-x-2">

              </div>
            </div>

              </div>
            </div>

              <div class="flex items-center justify-between bg-white/5 border border-white/10 rounded-xl p-3">

                  <span>上一页</span>
                </button>
                <div class="text-xs text-slate-300 font-medium">

                <button onclick="nextPPT()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-2 shadow-md">
                  <span>下一页</span>
                  <i class="fa-solid fa-chevron-right"></i>
                </button>
              </div>

              <div id="ppt-slide-footer" class="bg-indigo-950/60 border border-indigo-500/30 rounded-xl p-4 text-xs sm:text-sm text-indigo-200 flex items-start space-x-3 backdrop-blur-sm">
                <i class="fa-solid fa-lightbulb text-amber-400 text-lg mt-0.5 flex-shrink-0"></i>
                <div>
                  <strong class="font-bold text-amber-300 block mb-1">执教要点提示 (Coach Tip):</strong>

                    在实际课堂中，保持清晰的指令与积极的语气。
                  </p>
                </div>
              </div>
            </div>

          </div>

        </div>

      </div>

    </div>

  </main>

  <div id="search-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-start justify-center pt-20 px-4">

        <button onclick="closeSearchModal()" class="text-slate-400 hover:text-slate-600 text-sm">
          <i class="fa-solid fa-xmark text-lg"></i>

      </div>

        <span>支持快捷键 ⌘K 唤起搜索</span>
        <span>按 ESC 退出</span>
      </div>
    </div>
  </div>

        if (wrapper) wrapper.innerHTML = buildModuleCardHTML(mod, 'right');

      // 延迟重绘 SVG 连接线

    // SVG 动态贝塞尔曲线连接线
    function drawSVGConnectors() {
      const svg = document.getElementById('svg-connectors');
      const centerNode = document.getElementById('center-node');
      if (!svg || !centerNode || currentView !== 'mindmap') return;

      svg.innerHTML = '';
      const svgRect = svg.getBoundingClientRect();
      const centerRect = centerNode.getBoundingClientRect();

      const centerLeft = {
        x: centerRect.left - svgRect.left,
        y: centerRect.top + centerRect.height / 2 - svgRect.top
      };
      const centerRight = {
        x: centerRect.right - svgRect.left,
        y: centerRect.top + centerRect.height / 2 - svgRect.top
      };

      MIND_MAP_DATA.modules.forEach((mod, idx) => {
        const card = document.getElementById(`card-${mod.id}`);
        if (!card) return;

        const cardRect = card.getBoundingClientRect();
        const isLeft = idx < 3;

        const startPt = isLeft ? centerLeft : centerRight;
        const endPt = {
          x: isLeft ? (cardRect.right - svgRect.left) : (cardRect.left - svgRect.left),
          y: cardRect.top + cardRect.height / 2 - svgRect.top
        };

        const controlX = startPt.x + (endPt.x - startPt.x) * 0.5;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const d = `M ${startPt.x} ${startPt.y} C ${controlX} ${startPt.y}, ${controlX} ${endPt.y}, ${endPt.x} ${endPt.y}`;

        path.setAttribute('d', d);
        path.setAttribute('stroke', mod.strokeColor);
        path.setAttribute('stroke-width', '2.5');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('class', 'connector-path opacity-60 hover:opacity-100');

        svg.appendChild(path);
      });
    }

    // 打开指定模块的 PPT 详情（只包含当前副标题/模块的内容）
    function openModulePPT(moduleId, topicIndex = 0) {
      currentModuleId = moduleId;
      const mod = MIND_MAP_DATA.modules.find(m => m.id === moduleId);
      if (!mod) return;

      currentModuleTopics = mod.topics.map(t => ({
        ...t,
        moduleTitle: mod.title,
        moduleColor: mod.colorTheme,
        badgeBg: mod.badgeBg,
        textClass: mod.textClass,
        strokeColor: mod.strokeColor
      }));

      currentTopicIndex = topicIndex >= 0 && topicIndex < currentModuleTopics.length ? topicIndex : 0;
      switchView('ppt');
    }

    function renderPPTCanvas() {
      const topic = currentModuleTopics[currentTopicIndex];

      const breadcrumbModule = document.getElementById('ppt-breadcrumb-module');
      if (breadcrumbModule) breadcrumbModule.innerText = topic.moduleTitle;
      
      const breadcrumbTopic = document.getElementById('ppt-breadcrumb-topic');
      if (breadcrumbTopic) breadcrumbTopic.innerText = topic.title;

      const categoryBadge = document.getElementById('ppt-slide-category-badge');
      if (categoryBadge) categoryBadge.innerText = topic.moduleTitle;

      const indexIndicator = document.getElementById('ppt-slide-index-indicator');
      if (indexIndicator) indexIndicator.innerText = `Slide ${currentTopicIndex + 1} / ${currentModuleTopics.length}`;

      const currNum = document.getElementById('ppt-curr-num');
      if (currNum) currNum.innerText = currentTopicIndex + 1;

      const totalNum = document.getElementById('ppt-total-num');
      if (totalNum) totalNum.innerText = currentModuleTopics.length;

      // 渲染标题
      const slideTitle = document.getElementById('ppt-slide-title');
      if (slideTitle) {
        slideTitle.innerHTML = `
          <i class="fa-solid ${topic.icon} text-indigo-400"></i>
          <span>${topic.title}</span>
        `;
      }

      // 渲染核心要点
      const bodyContainer = document.getElementById('ppt-slide-body');
      if (bodyContainer) {
        bodyContainer.innerHTML = topic.bullets.map((b) => `
          <div class="flex items-start space-x-3 bg-white/5 hover:bg-white/10 p-3.5 rounded-xl border border-white/5 transition">

      const coachTip = document.getElementById('ppt-coach-tip-text');
      if (coachTip) coachTip.innerText = topic.tip || "请时刻关注练习者的动作标准与安全。";

      // 重新渲染侧边栏高亮状态
      renderPPTSidebar();
    }

    function selectPPTTopic(index) {
      if (index >= 0 && index < currentModuleTopics.length) {
        currentTopicIndex = index;
        renderPPTCanvas();
      }
    }

    function prevPPT() {
      if (currentTopicIndex > 0) {
        currentTopicIndex--;
        renderPPTCanvas();
      }
    }

    function nextPPT() {
      if (currentTopicIndex < currentModuleTopics.length - 1) {
        currentTopicIndex++;
        renderPPTCanvas();
      }
    }

    function jumpToPPTByTopicId(topicId) {
      for (const mod of MIND_MAP_DATA.modules) {
        const topicIdx = mod.topics.findIndex(t => t.id === topicId);
        if (topicIdx !== -1) {
          openModulePPT(mod.id, topicIdx);
          break;
        }
      }
    }

    function openSearchModal() {
      const modal = document.getElementById('search-modal');
      const card = document.getElementById('search-modal-card');
      if (!modal || !card) return;
      modal.classList.remove('hidden');
      setTimeout(() => {
        card.classList.remove('scale-95', 'opacity-0');
        card.classList.add('scale-100', 'opacity-100');
        document.getElementById('search-input')?.focus();
      }, 10);
    }

    function closeSearchModal() {
      const modal = document.getElementById('search-modal');
      const card = document.getElementById('search-modal-card');
      if (!modal || !card) return;
      card.classList.remove('scale-100', 'opacity-100');
      card.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 150);
    }

    // 快捷键支持 (⌘K 打开搜索, ESC 关闭, ←/→ 键翻页)
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearchModal();
      }
      if (e.key === 'Escape') {
        closeSearchModal();
      }
      if (currentView === 'ppt') {
        if (e.key === 'ArrowLeft') prevPPT();
        if (e.key === 'ArrowRight') nextPPT();
      }
    });

    function handleSearch() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const resultsContainer = document.getElementById('search-results');

      if (!query) {
        resultsContainer.innerHTML = `<p class="text-slate-400 text-center py-6">请输入关键词开始搜索...</p>`;
        return;
      }

      const matches = [];
      MIND_MAP_DATA.modules.forEach((mod) => {
        mod.topics.forEach((topic) => {
          const titleMatch = topic.title.toLowerCase().includes(query);
          const bulletMatch = topic.bullets.some((b) => b.toLowerCase().includes(query));
          if (titleMatch || bulletMatch) {
            matches.push({ ...topic, moduleTitle: mod.title, moduleId: mod.id });
          }
        });
      });

      if (matches.length === 0) {
        resultsContainer.innerHTML = `<p class="text-slate-400 text-center py-6">未找到与 “${query}” 相关的要点</p>`;
        return;
      }

      resultsContainer.innerHTML = matches.map((m) => `
        <div onclick="jumpToPPTByTopicId('${m.id}'); closeSearchModal();" 
             class="p-3 bg-slate-50 hover:bg-indigo-50 rounded-xl cursor-pointer border border-slate-200/80 transition flex items-center justify-between group">
          <div>
            <div class="flex items-center space-x-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-700">${m.moduleTitle}</span>
              <strong class="text-slate-800 group-hover:text-indigo-600">${m.title}</strong>
            </div>
            <p class="text-slate-500 text-[11px] mt-1 line-clamp-1">${m.bullets.join(' | ')}</p>
          </div>
          <i class="fa-solid fa-arrow-right text-slate-300 group-hover:text-indigo-600 text-xs"></i>
        </div>
      `).join('');
    }

    window.addEventListener('resize', () => {
      if (currentView === 'mindmap') {
        drawSVGConnectors();
      }
    });
  </script>
