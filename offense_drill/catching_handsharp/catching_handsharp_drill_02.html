    <h4>Drill 2：多角度手型精准捕捉与抗干扰接球</h4>
    <p><strong>场地：</strong> 10m x 5m 区域，传球员在 8 米外。</p>
    <p><strong>流程：</strong> 接球员沿着横向或斜向路线跑动，传球员随机传出高空抛物球或低平快速球。接球员在移动中调整手臂与手指手型接球。旁边设一名持防守垫（Dummy）的队员进行无身体接触的视觉干扰。</p>
    <p><strong>评估指标：</strong> 手型正确率（高球钻石/低球篮筐均达 90% 以上）、无掌心拍球现象、接球后 0.5 秒内完成收球锁腋。</p>
