    <div class="drill-tag tag-orange">常规 Drill</div>
    <h4>Drill 1：高低手型极速响应对墙/墙抛训练</h4>
    <p><strong>场地：</strong> 队员距墙面 2-3 米，或两人一组对立。</p>
    <p><strong>流程：</strong> 教练/搭档随机投掷高低不一的软球或网球，队员在球到面前瞬间喊出“钻石”或“篮筐”并做出对应手型接球。接球后快速将球拉回腋下完成收球。</p>
    <p><strong>进阶：</strong> 增加投掷速度，并在出球前做随机的高低假动作，训练反应速度。</p>
    <p><strong>退阶：</strong> 原地做无球手型模仿，根据教练口令（“高！”/“低！”）做手型快速转换训练。</p>
